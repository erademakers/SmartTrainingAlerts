<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1b24"/>
      <stop offset="100%" stop-color="#162d3a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f23"/>
      <stop offset="100%" stop-color="#111417"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#090b0d"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="250" cy="170" r="170" fill="#2f4957" opacity="0.28"/>
  <circle cx="1060" cy="1040" r="260" fill="#274e3e" opacity="0.22"/>

  <g filter="url(#softShadow)">
    <rect x="140" y="230" rx="58" ry="58" width="920" height="620" fill="url(#device)"/>
    <rect x="190" y="280" rx="28" ry="28" width="820" height="520" fill="url(#screen)"/>
  </g>

  <text x="600" y="185" text-anchor="middle" fill="#d4dde2" font-family="Helvetica, Arial, sans-serif" font-size="44" letter-spacing="2">SMARTTRAININGALERTS</text>
  <text x="600" y="905" text-anchor="middle" fill="#dbe7ed" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700">HeartRate Data Field</text>
  <text x="600" y="958" text-anchor="middle" fill="#97aeb9" font-family="Helvetica, Arial, sans-serif" font-size="30">Live zone view with interval and recovery tracking</text>

  <g transform="translate(190 280)">
    <rect width="820" height="520" rx="28" ry="28" fill="#0b0e10"/>

    <rect x="40" y="86" width="34" height="350" rx="8" fill="#2d3135"/>
    <rect x="40" y="226" width="34" height="210" rx="8" fill="#ff9a22"/>
    <text x="57" y="67" fill="#f6f8fa" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24">Z4</text>

    <rect x="746" y="86" width="34" height="350" rx="8" fill="#2d3135"/>
    <rect x="746" y="314" width="34" height="122" rx="8" fill="#f44336"/>
    <text x="763" y="67" fill="#f6f8fa" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24">Z5</text>

    <text x="410" y="112" text-anchor="middle" fill="#edf4f8" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700">ZONE</text>
    <text x="410" y="300" text-anchor="middle" fill="#20c362" font-family="Helvetica, Arial, sans-serif" font-size="208" font-weight="700">4.5</text>

    <text x="410" y="414" text-anchor="middle" fill="#a8b8c2" font-family="Helvetica, Arial, sans-serif" font-size="28">Interval</text>
    <text x="410" y="454" text-anchor="middle" fill="#f0f5f8" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700">118s / 300s</text>

    <rect x="312" y="480" width="196" height="14" rx="7" fill="#2f353a"/>
    <rect x="312" y="480" width="78" height="14" rx="7" fill="#20c362"/>
  </g>
</svg>
